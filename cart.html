<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart – Sudd’s Paradise</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-primary:#90EE90;
  --color-secondary:#F0F8FF;
  --color-accent:#FFD700;
  --color-bg-gradient:linear-gradient(135deg,#F0F8FF 0%,#FFFFFF 100%);
  --color-text:#2F2F2F;
  --color-earth:#A58F7B;
  --color-ivory:#F9F7F3;
  --radius:4px;
  --transition:0.3s ease-out;
  --max-width:1440px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Montserrat',sans-serif;
  color:var(--color-text);
  background:var(--color-bg-gradient);
  line-height:1.6;
}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
h1,h2,h3{font-family:'Playfair Display',serif;margin-bottom:0.5em;}
h1{font-size:clamp(32px,6vw,48px);font-weight:700;letter-spacing:0.5px;line-height:1.2;}
h2{font-size:clamp(28px,5vw,36px);font-weight:600;letter-spacing:0.4px;line-height:1.3;}
h3{font-size:clamp(22px,4vw,28px);font-weight:500;letter-spacing:0.3px;line-height:1.4;}
p{margin-bottom:1rem;}
.container{max-width:var(--max-width);margin:auto;padding:0 16px;}
/* Skip link */
.skip-link{position:absolute;left:-999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:-1000;}
.skip-link:focus{left:0;top:0;width:auto;height:auto;padding:8px;background:#fff;color:#000;z-index:1000;}
/* Navigation */
header{position:sticky;top:0;z-index:100;background:transparent;transition:var(--transition);}
header.scrolled{background:#fff;border-bottom:2px solid var(--color-accent);}
nav{display:flex;justify-content:center;gap:24px;padding:16px 0;}
nav a{font-weight:600;padding:8px 12px;border-radius:var(--radius);}
nav a.active,nav a:hover{color:var(--color-accent);}
nav a:focus{outline:2px solid var(--color-accent);outline-offset:2px;}
/* Buttons */
.btn-primary{
  display:inline-block;
  background:var(--color-accent);
  color:#2F2F2F;
  padding:12px 24px;
  border-radius:var(--radius);
  font-weight:600;
  transition:transform 0.2s,var(--transition);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,0.1);
}
.btn-primary:hover{transform:scale(1.04);box-shadow:0 0 8px rgba(255,215,0,0.6);}
.btn-primary:active{transform:scale(0.97);box-shadow:inset 0 0 8px rgba(0,0,0,0.2);}

/* Cart specific */
section{padding:80px 0;opacity:0;transform:translateY(30px);transition:opacity 0.6s var(--transition),transform 0.6s var(--transition);}
section.visible{opacity:1;transform:none;}
.cart-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}
.cart-table th,
.cart-table td{
  padding:12px;
  text-align:left;
  border-bottom:1px solid rgba(0,0,0,0.05);
}
.cart-table th{color:var(--color-accent);font-weight:600;}
.cart-item-img{width:80px;height:80px;object-fit:cover;}
.qty-control{
  display:flex;
  align-items:center;
  gap:4px;
}
.qty-control button{
  background:var(--color-earth);
  color:#fff;
  border:none;
  width:28px;
  height:28px;
  border-radius:var(--radius);
  cursor:pointer;
  font-size:1rem;
  transition:background var(--transition);
}
.qty-control button:hover{background:var(--color-accent);}
.qty-control input{
  width:40px;
  text-align:center;
  border:1px solid var(--color-earth);
  border-radius:var(--radius);
  padding:4px;
}
.subtotal-box,
.shipping-box,
.promo-box{
  background:#fff;
  padding:24px;
  border-radius:var(--radius);
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  margin-bottom:24px;
}
.subtotal-box h3,
.shipping-box h3,
.promo-box h3{margin-bottom:0.5rem;}
.fixed-cta{
  position:fixed;
  inset-inline:0;
  bottom:0;
  background:var(--color-accent);
  padding:16px 0;
  text-align:center;
  box-shadow:0 -2px 6px rgba(0,0,0,0.1);
}
.fixed-cta .btn-primary{
  background:#fff;
  color:var(--color-text);
}
footer{background:#fff;padding:24px 0;text-align:center;font-size:14px;}
/* Media Queries */
@media(min-width:768px){
  nav{justify-content:flex-end;padding:0 24px;}
}
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<header id="site-header">
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html" class="active" aria-current="page">Cart</a>
  </nav>
</header>

<main id="main-content" class="container">
  <section class="cart-items visible">
    <h1>Your Cart</h1>
    <table class="cart-table" aria-label="Cart items">
      <thead>
        <tr>
          <th scope="col">Product</th>
          <th scope="col">Price</th>
          <th scope="col">Quantity</th>
          <th scope="col">Total</th>
          <th scope="col">Remove</th>
        </tr>
      </thead>
      <tbody id="cart-body">
        <tr data-price="29.99">
          <td>
            <div style="display:flex;align-items:center;gap:12px;">
              <img src="https://picsum.photos/seed/product1/80/80" alt="Lavender Hand‑crafted Soap" class="cart-item-img">
              <span>Lavender Hand‑crafted Soap</span>
            </div>
          </td>
          <td>$29.99</td>
          <td>
            <div class="qty-control">
              <button class="decrease" aria-label="Decrease quantity">−</button>
              <input type="number" min="1" value="1" class="qty-input" aria-label="Quantity">
              <button class="increase" aria-label="Increase quantity">+</button>
            </div>
          </td>
          <td class="line-total">$29.99</td>
          <td><button class="remove-item btn-primary" aria-label="Remove item">×</button></td>
        </tr>
        <tr data-price="45.00">
          <td>
            <div style="display:flex;align-items:center;gap:12px;">
              <img src="https://picsum.photos/seed/product2/80/80" alt="Citrus Burst Body Wash" class="cart-item-img">
              <span>Citrus Burst Body Wash</span>
            </div>
          </td>
          <td>$45.00</td>
          <td>
            <div class="qty-control">
              <button class="decrease" aria-label="Decrease quantity">−</button>
              <input type="number" min="1" value="2" class="qty-input" aria-label="Quantity">
              <button class="increase" aria-label="Increase quantity">+</button>
            </div>
          </td>
          <td class="line-total">$90.00</td>
          <td><button class="remove-item btn-primary" aria-label="Remove item">×</button></td>
        </tr>
      </tbody>
    </table>
  </section>

  <section class="subtotal-box visible">
    <h2>Subtotal</h2>
    <p id="subtotal-amount" style="font-size:1.25rem;font-weight:600;">$119.99</p>
  </section>

  <section class="shipping-box visible">
    <h2>Estimate Shipping</h2>
    <form id="shipping-form" novalidate>
      <label for="zip-code">Enter ZIP / Postal Code</label>
      <input type="text" id="zip-code" name="zip" placeholder="e.g., 10001" required
             style="padding:12px;width:100%;max-width:300px;border:2px solid var(--color-earth);border-radius:var(--radius);margin-top:8px;">
      <button type="submit" class="btn-primary" style="margin-top:12px;">Calculate</button>
    </form>
  </section>

  <section class="promo-box visible">
    <h2>Promo Code</h2>
    <form id="promo-form" novalidate>
      <label for="promo-code">Have a code?</label>
      <input type="text" id="promo-code" name="promo" placeholder="ENTER CODE"
             style="padding:12px;width:100%;max-width:300px;border:2px solid var(--color-earth);border-radius:var(--radius);margin-top:8px;">
      <button type="submit" class="btn-primary" style="margin-top:12px;">Apply</button>
    </form>
  </section>
</main>

<div class="fixed-cta">
  <button class="btn-primary" id="checkout-btn">Proceed to Checkout</button>
</div>

<footer>
  <div class="container">
    <p>&copy; 2024 Sudd’s Paradise. All rights reserved.</p>
  </div>
</footer>

<script>
/* Header scroll effect */
document.addEventListener('scroll', () => {
  const header = document.querySelector('header');
  header.classList.toggle('scrolled', window.scrollY > 50);
});

/* Quantity & subtotal handling */
function recalcSubtotal() {
  let total = 0;
  document.querySelectorAll('#cart-body tr').forEach(row => {
    const price = parseFloat(row.dataset.price);
    const qty = parseInt(row.querySelector('.qty-input').value,10);
    const lineTotal = price * qty;
    row.querySelector('.line-total').textContent = `$${lineTotal.toFixed(2)}`;
    total += lineTotal;
  });
  document.getElementById('subtotal-amount').textContent = `$${total.toFixed(2)}`;
}
document.querySelectorAll('.increase').forEach(btn => {
  btn.addEventListener('click', e => {
    const input = e.target.closest('.qty-control').querySelector('.qty-input');
    input.value = parseInt(input.value,10) + 1;
    recalcSubtotal();
  });
});
document.querySelectorAll('.decrease').forEach(btn => {
  btn.addEventListener('click', e => {
    const input = e.target.closest('.qty-control').querySelector('.qty-input');
    const newVal = Math.max(1, parseInt(input.value,10) - 1);
    input.value = newVal;
    recalcSubtotal();
  });
});
document.querySelectorAll('.remove-item').forEach(btn => {
  btn.addEventListener('click', e => {
    const row = e.target.closest('tr');
    row.parentNode.removeChild(row);
    recalcSubtotal();
  });
});
document.getElementById('promo-form').addEventListener('submit', e => {
  e.preventDefault();
  alert('Promo code applied (demo).');
});
document.getElementById('shipping-form').addEventListener('submit', e => {
  e.preventDefault();
  alert('Shipping estimate calculated (demo).');
});
document.getElementById('checkout-btn').addEventListener('click', () => {
  // In a real Shopify theme this would redirect to /checkout
  window.location.href = '/checkout';
});
</script>
</body>
</html>
